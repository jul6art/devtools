name: Release

on:
    push:
        tags: ['v*']
    # Actions stay DISABLED between monthly passes (see ci.yml): a tag pushed then is built once they are on.
    workflow_dispatch:

permissions:
    contents: write
    id-token: write
    attestations: write
    packages: write

# ADR-0034: every release carries a phar, its SHA-256 and a provenance attestation — which `self-update`
# verifies before replacing anything — and a Docker image built from that very phar.

jobs:
    phar:
        name: Phar, checksum, attestation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2, box

            - name: Production dependencies
              run: COMPOSER_ROOT_VERSION="${GITHUB_REF_NAME#v}" composer install --no-dev --no-interaction --no-progress

            - name: Build the phar
              run: box compile --no-interaction

            - name: Checksum
              run: (cd build && sha256sum devtools.phar > devtools.phar.sha256)

            - name: Check the phar
              run: php build/devtools.phar --version | grep "${GITHUB_REF_NAME#v}"

            - uses: actions/attest-build-provenance@v2
              with:
                  subject-path: build/devtools.phar

            - name: Publish on the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$GITHUB_REF_NAME" build/devtools.phar build/devtools.phar.sha256 --clobber

            - uses: actions/upload-artifact@v4
              with:
                  name: phar
                  path: build/devtools.phar

    image:
        name: Docker image
        needs: phar
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: phar
                  path: build

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Build and push
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  docker build --tag "ghcr.io/jul6art/devtools:${version}" --tag ghcr.io/jul6art/devtools:latest .
                  docker run --rm "ghcr.io/jul6art/devtools:${version}" --version | grep "${version}"
                  docker push "ghcr.io/jul6art/devtools:${version}"
                  docker push ghcr.io/jul6art/devtools:latest
